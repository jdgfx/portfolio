    <!-- Google Fonts: Playfair Display & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* Base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f0eb;
            color: #3a3532;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation Grid */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 2.5rem 3rem;
            width: 100%;
        }

        /* Top Center SVG Logo Container */
        .logo-container {
            grid-column: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Adjust size for horizontal wordmark logo */
        .logo-container svg {
            height: 28px;
            width: auto;
            color: #3a3532;
        }

        /* Top Right Navigation Links */
        nav {
            grid-column: 3;
            justify-self: end;
            display: flex;
            gap: 2rem;
            font-family: 'Playfair Display', serif;
        }

        nav a {
            color: #6b635b;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            text-transform: lowercase;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #3a3532;
        }

        /* Main Content & Video Embed Container */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 3rem 4rem;
            width: 100%;
        }

        .video-wrapper {
            width: 100%;
            max-width: 1400px; /* Spans most of the width while maintaining margins */
            aspect-ratio: 16 / 9;
            background: #2a2522;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(58, 53, 50, 0.08);
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Mobile Layout */
        @media (max-width: 768px) {
            header {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                padding: 1.5rem;
            }

            main {
                padding: 1rem;
            }

            nav {
                gap: 1.25rem;
            }

            .logo-container svg {
                height: 22px;
            }

            .video-wrapper {
                border-radius: 20px;
            }
        }
    </style>
</head>
