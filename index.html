<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh Diaz</title>
    <style>
        /* Base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation Grid */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 2rem 3rem;
            width: 100%;
        }

        /* Top Center SVG Logo Container */
        .logo-container {
            grid-column: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container svg {
            width: 48px;
            height: 48px;
            fill: #ffffff;
        }

        /* Top Right Navigation Links */
        nav {
            grid-column: 3;
            justify-self: end;
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: lowercase;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Main Content & Video Embed Container */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 3rem 4rem;
            width: 100%;
        }

        .video-wrapper {
            width: 100%;
            max-width: 1400px; /* Spans most of the width while maintaining margins */
            aspect-ratio: 16 / 9;
            background: #0a0a0a;
            border-radius: 4px;
            overflow: hidden;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Mobile Layout */
        @media (max-width: 768px) {
            header {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                padding: 1.5rem;
            }

            main {
                padding: 1rem;
            }

            nav {
                gap: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <!-- Empty element to keep grid balanced -->
        <div></div>

        <!-- TOP CENTER SVG LOGO PLACEHOLDER -->
<div class="logo-container">
    <img src="logo.svg" alt="Josh Diaz Logo" style="height: 48px; width: auto;">
</div>

        <!-- TOP RIGHT NAVIGATION LINKS -->
        <nav>
            <a href="#reel">reel</a>
            <a href="#work">work</a>
            <a href="#about">about</a>
            <a href="#contact">contact</a>
        </nav>
    </header>

    <!-- MAIN VIDEO CONTENT -->
    <main>
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/HB8qKkWlExs?rel=0" 
                title="Featured Video" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </main>

</body>
</html>
