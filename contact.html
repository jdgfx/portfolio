<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Josh Diaz</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f0eb; /* Warmer Cream Background */
            color: #3a3532; /* Brownish-Charcoal Text */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            font-size: 1.125rem;
            line-height: 1.85;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation Grid */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 2.5rem 3rem;
            width: 100%;
        }

        .logo-container {
            grid-column: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container svg {
            height: 28px;
            width: auto;
            color: #24201e;
        }

        nav {
            grid-column: 3;
            justify-self: end;
            display: flex;
            gap: 2rem;
        }

        nav a {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-weight: 600;
            color: #78706a;
            text-decoration: none;
            font-size: 1.15rem;
            text-transform: none;
            transition: color 0.2s ease;
        }

        nav a:hover, nav a.active {
            color: #24201e;
        }

        /* Main Content & Contact Form */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem 5rem;
            width: 100%;
        }

        .contact-container {
            width: 100%;
            max-width: 560px;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: 2.25rem;
            margin-bottom: 2rem;
            font-weight: 600;
            color: #24201e;
            letter-spacing: -0.02em;
        }

        /* Form Layout & Styles */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            color: #78706a;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #e2dad2;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: #24201e;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder, textarea::placeholder {
            color: #a39b94;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #24201e;
            box-shadow: 0 0 0 3px rgba(36, 32, 30, 0.08);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        button[type="submit"] {
            margin-top: 0.5rem;
            background-color: #24201e;
            color: #f5f0eb;
            border: none;
            border-radius: 8px;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            header {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                padding: 1.5rem;
            }

            nav {
                gap: 1.25rem;
            }

            .logo-container svg {
                height: 22px;
            }
        }
    </style>
</head>
<body>

        <div></div>
        <div class="logo-container">

                    </g>
                  </g>
                </svg>
            </a>
        </div>
        <nav>
            <a href="index.html">Reel</a>
            <a href="#work">Work</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
            <a href="Resume-JoshDiaz.pdf" download="Resume-JoshDiaz.pdf" target="_blank">Resume</a>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            <h1>Get in touch</h1>

            <form action="https://formspree.io/f/mkjwdboy" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Project inquiry, dynamic graphics, etc.">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Tell me about your project..." required></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </main>

</body>
</html>
